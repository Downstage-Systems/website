<!DOCTYPE html><html><head><meta charset="utf-8">
<title>Virtual Deck — Downstage (Demo)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Demo twin of the unit's /virtual-deck pop-out. The deck is a canned
     mockup (deck.html); the status tray is simulated to match the demo unit. -->
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; background:#0B0D10; overflow:hidden; }
body { display:flex; font-family:'Rajdhani',system-ui,sans-serif; }
.main { flex:1; min-width:0; display:flex; flex-direction:column; }
header { display:flex; align-items:center; justify-content:center; gap:10px;
  padding:9px 0 7px; user-select:none; -webkit-user-select:none; position:relative; }
header svg { width:22px; height:22px; }
.wm { font-size:17px; font-weight:700; letter-spacing:0.22em; color:#E8ECEF; }
.wm b { color:#2FD97B; font-weight:700; }
#tray-btn { position:absolute; right:12px; top:7px; background:#14181d; color:#9AA4AD;
  border:1px solid #2a323c; border-radius:7px; font:700 12px 'Rajdhani',system-ui; letter-spacing:0.08em;
  padding:4px 10px; cursor:pointer; }
#tray-btn:hover { color:#2FD97B; border-color:#2FD97B; }
.chassis { flex:1; margin:0 12px 12px; min-height:0;
  background:linear-gradient(180deg,#1c2127,#14181d 60%);
  border:1px solid #2a323c; border-radius:20px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), inset 0 -2px 8px rgba(0,0,0,0.5),
              0 10px 30px rgba(0,0,0,0.6);
  padding:12px; display:flex; }
.screen { flex:1; min-height:0; background:#000; border-radius:10px; overflow:hidden;
  border:1px solid #06070a; box-shadow: inset 0 0 12px rgba(0,0,0,0.8); }
iframe { border:0; width:100%; height:100%; display:block; background:#000; }
#tray { width:0; overflow:hidden; transition:width 0.2s; background:#101318;
  border-left:1px solid #2a323c; display:flex; flex-direction:column; }
#tray.on { width:260px; }
.tr-inner { width:260px; padding:12px; display:flex; flex-direction:column; gap:10px;
  flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; }
.tr-inner > * { flex-shrink:0; }
.tr-inner::-webkit-scrollbar { width:8px; }
.tr-inner::-webkit-scrollbar-thumb { background:#2a323c; border-radius:4px; }
.tr-inner::-webkit-scrollbar-thumb:hover { background:#3a444d; }
#split { display:none; width:9px; flex-shrink:0; cursor:col-resize; touch-action:none;
  position:relative; }
#split.on { display:block; }
#split::after { content:''; position:absolute; left:3px; top:50%; transform:translateY(-50%);
  width:3px; height:46px; border-radius:2px; background:#2a323c; }
#split:hover::after, #split.drag::after { background:#2FD97B; }
.tr-h { font:700 11px 'Rajdhani',system-ui; letter-spacing:0.22em; color:#F5A524; }
.pv { background:#000; border:1px solid #2a323c; border-radius:8px; overflow:hidden;
  aspect-ratio:16/9; position:relative; }
.pv iframe { pointer-events:none; }
.pvbar { font:11px ui-monospace,monospace; margin-top:5px; padding:4px 8px; text-align:center;
  border-radius:7px; border:1px solid transparent; }
.pvbar.ok { color:#2FD97B; border-color:rgba(47,217,123,0.35); background:rgba(47,217,123,0.08); }
.pvbar.virt { color:#F5A524; border-color:rgba(245,165,36,0.35); background:rgba(245,165,36,0.08); }
.st { display:flex; align-items:center; gap:8px; font:12px ui-monospace,monospace; color:#9AA4AD; }
.st .dot { width:8px; height:8px; border-radius:50%; background:#5a646d; flex-shrink:0; }
.st .dot.ok { background:#2FD97B; }
.tbtns { display:flex; gap:8px; margin-top:2px; }
.tbtn { flex:1; padding:8px 0; background:#14181d; border:1px solid #2a323c; border-radius:8px;
  color:#9AA4AD; font:700 12px 'Rajdhani',system-ui; letter-spacing:0.08em; cursor:pointer; text-align:center; }
.tbtn:hover { color:#E8ECEF; border-color:#3a444d; }
.tbtn.bo { color:#E5484D; border-color:rgba(229,72,77,0.4); }
.tbtn.bo.active { background:#E5484D; color:#fff; animation:boflash 1s infinite; }
@keyframes boflash { 50% { opacity:0.6; } }
</style></head><body>
<div class="main">
<header>
  <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="3" width="20" height="18" rx="3"
    stroke="#2FD97B" stroke-width="2"/>
    <rect x="5.6" y="6.4" width="3.2" height="3.2" rx="0.8" fill="#E8ECEF"/>
    <rect x="10.4" y="6.4" width="3.2" height="3.2" rx="0.8" fill="#E8ECEF"/>
    <rect x="15.2" y="6.4" width="3.2" height="3.2" rx="0.8" fill="#E8ECEF"/>
    <rect x="5.6" y="11.6" width="12.8" height="1.9" rx="0.95" fill="#2FD97B"/>
    <circle cx="7.2" cy="16.6" r="1.5" stroke="#2FD97B" stroke-width="1.3"/>
    <circle cx="12" cy="16.6" r="1.5" stroke="#2FD97B" stroke-width="1.3"/>
    <circle cx="16.8" cy="16.6" r="1.5" stroke="#2FD97B" stroke-width="1.3"/></svg>
  <span class="wm">VIRTUAL <b>DECK</b></span>
  <button id="tray-btn" onclick="toggleTray()">STATUS &#9656;</button>
</header>
<div class="chassis"><div class="screen">
  <iframe id="w" src="deck.html"></iframe>
</div></div>
</div>
<div id="split" title="Drag to resize the status tray"></div>
<div id="tray"><div class="tr-inner">
  <div class="tr-h">DISPLAYS</div>
  <div>
    <div class="pv"><iframe id="pv1" src="screen.html?src=cleantimer&key=000000&tc=ffffff&freeze=true&hp=true&hc=true"></iframe></div>
    <div class="pvbar ok">HDMI 1 &mdash; SAMSUNG Q60B</div>
  </div>
  <div>
    <div class="pv"><iframe id="pv2" src="screen.html?src=pattern-card"></iframe></div>
    <div class="pvbar virt">HDMI 2 &mdash; virtual</div>
  </div>
  <div class="tbtns">
    <button class="tbtn" onclick="refreshPv()" title="Re-arm both preview tiles">REFRESH</button>
    <button class="tbtn bo" id="t-bo" onclick="boToggle()" title="Black out all displays — press again to resume">BLACKOUT</button>
  </div>
  <div class="tr-h" style="margin-top:6px">CONNECTIONS</div>
  <div class="st"><div class="dot ok"></div><span>ONTIME</span></div>
  <div class="st"><div class="dot ok"></div><span>COMPANION</span></div>
  <div class="st"><div class="dot ok"></div><span>ONE OG &middot; 192.168.1.20</span></div>
</div></div>
<script>
const PV = {
  1: 'screen.html?src=cleantimer&key=000000&tc=ffffff&freeze=true&hp=true&hc=true',
  2: 'screen.html?src=pattern-card',
};
let trayOn = false, bo = false;
let trayW = 260;
try { trayW = Math.min(700, Math.max(200, +localStorage.getItem('ds1-tray-w') || 260)); } catch (e) {}
function applyTrayW() {
  document.getElementById('tray').style.width = trayOn ? trayW + 'px' : '0px';
  document.querySelector('.tr-inner').style.width = trayW + 'px';
}
function toggleTray() {
  trayOn = !trayOn;
  document.getElementById('tray').classList.toggle('on', trayOn);
  document.getElementById('split').classList.toggle('on', trayOn);
  applyTrayW();
  document.getElementById('tray-btn').innerHTML = trayOn ? 'STATUS &#9662;' : 'STATUS &#9656;';
  try { window.resizeBy(trayOn ? trayW : -trayW, 0); } catch (e) {}
}
(() => {
  const split = document.getElementById('split');
  split.addEventListener('pointerdown', e => {
    if (!trayOn) return;
    e.preventDefault();
    split.setPointerCapture(e.pointerId);
    split.classList.add('drag');
    const tray = document.getElementById('tray');
    const startX = e.clientX, startW = tray.getBoundingClientRect().width;
    tray.style.transition = 'none';
    const move = ev => {
      const max = Math.max(200, window.innerWidth - 340);
      trayW = Math.min(Math.max(startW + (startX - ev.clientX), 200), max);
      applyTrayW();
    };
    const up = () => {
      split.classList.remove('drag');
      tray.style.transition = '';
      split.removeEventListener('pointermove', move);
      split.removeEventListener('pointerup', up);
      try { localStorage.setItem('ds1-tray-w', Math.round(trayW)); } catch (err) {}
    };
    split.addEventListener('pointermove', move);
    split.addEventListener('pointerup', up);
  });
})();
function refreshPv() {
  for (const n of [1, 2]) {
    const f = document.getElementById('pv' + n);
    f.src = bo ? 'screen.html?src=blackout' : PV[n];
  }
}
function boToggle() {
  bo = !bo;
  const b = document.getElementById('t-bo');
  b.classList.toggle('active', bo);
  b.textContent = bo ? 'RESUME' : 'BLACKOUT';
  refreshPv();
}
</script></body></html>
